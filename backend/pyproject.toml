[project]
name = "esg-rag-backend"
version = "0.1.0"
description = "Backend API for the Enterprise Agentic ESG Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "openai>=1.50",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "onnxruntime>=1.28",
    "tokenizers>=0.22",
    "huggingface_hub>=1.0",
    "langfuse>=4.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.15.22",
    "reportlab>=4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
